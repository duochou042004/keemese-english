version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      nuget-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
    ignore:
      # ESLint stays on 9 until eslint-plugin-jsx-a11y supports ESLint 10.
      - { dependency-name: eslint, update-types: [version-update:semver-major] }
      - { dependency-name: '@eslint/js', update-types: [version-update:semver-major] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
    groups:
      docker-minor-patch: { update-types: [minor, patch] }
