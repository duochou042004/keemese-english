# Weekly Windows/macOS compatibility run (docs/testing/ci.md#compatyml--cross-platform-check).
# Integration tests and E2E stay on Linux: hosted macOS has no Docker, Windows can't run Linux containers.
name: compat

on:
  schedule: [{ cron: '0 2 * * 1' }]
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions: { contents: read }

concurrency:
  # Include the label state so an unrelated label or push doesn't cancel a real compat run and then skip itself.
  group: compat-${{ github.ref }}-${{ contains(github.event.pull_request.labels.*.name, 'compat') }}
  cancel-in-progress: true

jobs:
  compat:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'compat')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: dotnet restore --locked-mode
      - run: dotnet build -warnaserror --no-restore
      - run: dotnet test --project tests/Keemese.UnitTests --no-build --results-directory TestResults --report-xunit-trx
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compat-trx-${{ matrix.os }}
          path: TestResults/*.trx
          retention-days: 5
          if-no-files-found: ignore
