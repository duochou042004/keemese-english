name: keemese

services:
  db:
    image: docker.io/library/postgres:18.6-alpine
    environment:
      POSTGRES_DB: keemese
      POSTGRES_USER: keemese
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keemese -d keemese"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    profiles: [app]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ConnectionStrings__Db: Host=db;Port=5432;Database=keemese;Username=keemese;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      Security__IpHashSalt: ${Security__IpHashSalt:-} # required: the app refuses to start without it
      # The TLS proxy in front (docs/operations/deployment.md); empty = trust no forwarded headers.
      ForwardedHeaders__KnownProxies: ${ForwardedHeaders__KnownProxies:-}
      ForwardedHeaders__KnownNetworks: ${ForwardedHeaders__KnownNetworks:-}
      # First run only (FR-AUTH-03); remove from .env after the first login.
      BOOTSTRAP_TUTOR_USERNAME: ${BOOTSTRAP_TUTOR_USERNAME:-}
      BOOTSTRAP_TUTOR_PASSWORD: ${BOOTSTRAP_TUTOR_PASSWORD:-}
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
